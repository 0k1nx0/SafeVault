name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg libfuse2

      - name: Build Linux (.AppImage + .deb + .rpm)
        run: npx electron-forge make --platform linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeVault-Linux
          path: out/make/**/*
          retention-days: 30
