name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            fakeroot \
            dpkg \
            libfuse2 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libsecret-1-0

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build Linux (AppImage + deb)
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        if: always()
        run: find dist-installer/ -type f 2>/dev/null || echo "No output found"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeVault-Linux
          path: dist-installer/*.{AppImage,deb,rpm}
          retention-days: 30
